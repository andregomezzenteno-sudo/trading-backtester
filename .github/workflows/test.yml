name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxis de app.js y engine.js
        run: node --check engine.js && node --check app.js
      # El motor (media móvil, backtest, simulación apalancada con
      # liquidación, comparador evergreen) no toca el DOM, así que se prueba
      # importándolo directamente — el mismo código que corre en producción.
      - name: Pruebas del motor determinista
        run: npm test
